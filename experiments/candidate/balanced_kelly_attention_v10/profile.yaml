name: balanced_kelly_attention_v10
# v10: Attention network + Kelly reward + more episodes
# Core hypothesis: previous failures were due to (1) GRU on flatten obs,
# (2) too few episodes, (3) reward function with conflicting terms.
# v10 fixes all three.
max_iters: 40
episode_per_iter: 10
episode_len: 500
hidden_sizes: [128, 64]
lr: 0.0001
update_batch_size: 64
update_repeat: 10
feature:
  packs:
    - kelly
reward:
  # --- Branch selector ---
  use_kelly_reward: true
  # --- Core performance signal ---
  use_alpha_reward: true
  alpha_scale: 3.2
  use_kelly_alpha: true
  # --- Cost terms ---
  transaction_cost: 0.10
  # --- Kelly reward (the ONLY shaping term) ---
  kelly_tracking_bonus: 0.60
  kelly_vol_attenuation: true
  kelly_min_signal: 0.15
  # --- REMOVED terms (all other reward terms set to 0) ---
  pbrs_coef: 0.0
  turnover_penalty: 0.0
  smoothness_penalty: 0.0
  micro_rebalance_penalty: 0.0
  micro_rebalance_threshold: 0.05
  episode_drawdown_penalty: 0.0
  episode_drawdown_threshold: 0.10
  downside_asymmetry_coef: 1.0
  drawdown_penalty: 0.0
  downside_penalty: 0.0
  risk_budget_penalty: 0.0
  high_exposure_penalty: 0.0
  trend_alignment_bonus: 0.0
  trend_alignment_threshold: 0.02
  opportunity_cost_penalty: 0.0
  opportunity_threshold_pos: 0.50
  opportunity_threshold_anchor: 0.05
  opportunity_threshold_trend: 0.02
  profit_taking_bonus: 0.0
  tranche_profit_threshold: 0.02
  panic_buy_bonus: 0.0
  panic_buy_cum_drop_threshold: -0.15
  panic_buy_regime_risk_threshold: 0.60
  rule_imitation_bonus: 0.0
  rule_decision_bonus: 0.0
  return_scale: 0.0
  activity_bonus: 0.0
  inactivity_penalty: 0.0
  rule_deviation_penalty: 0.0
  short_hold_turnover_penalty: 0.0
  flat_trade_penalty: 0.0
  cooldown_penalty: 0.0
  vol_trading_bonus: 0.0
  underwater_sell_penalty: 0.0
position_cap:
  start_drawdown: 0.10
  full_drawdown: 0.30
  min_cap: 0.40
  curve_power: 1.0
  bull_min_cap: 0.65
  bull_vol_threshold: 0.40
  bull_anchor_threshold: 0.02
  bear_min_cap: 0.30
  bear_regime_threshold: 0.65
promotion_gate:
  max_test_2022_drawdown: 30.0
  max_test_2022_avg_pos: 0.35
  min_test_proxy_sharpe: 0.75
  min_wf_2023_2024_return: 0.0
  min_wf_2023_2024_sharpe: 0.0
selection_score:
  return_weight: 1.0
  sharpe_weight: 20.0
  max_dd_penalty: 0.12
  avg_pos_penalty: 0.0
  stress_avg_pos_penalty: 0.0
  stress_threshold: 0.65
  staged_training: true
  stage_iters: 20
execution:
  base_threshold: 0.04
  quiet_threshold: 0.08
  stress_threshold: 0.012
  trade_lock_days: 8
model:
  # Attention network (replaces GRU)
  use_attention: true
  attention_dim: 64
  attention_heads: 4
  use_hybrid_overlay: true
  delta_levels: [-0.10, -0.05, 0.0, 0.05, 0.10]
  hard_floor: 0.20
  observation_window: 5
sampling:
  # Smaller stride = more episodes for training
  episode_stride: 100
