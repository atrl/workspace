name: balanced_rule_residual_minimal_v1
max_iters: 80
episode_per_iter: 10
episode_len: 300
hidden_sizes: [128, 64]
lr: 0.0003
update_batch_size: 64
update_repeat: 10
reward:
  # --- Minimal reward: only 5 active terms ---
  use_minimal_reward: true
  use_alpha_reward: true
  alpha_scale: 3.0
  use_kelly_alpha: true
  transaction_cost: 0.08
  turnover_penalty: 0.05
  smoothness_penalty: 0.03
  # Episode drawdown penalty — proven critical (v12/v13/v16)
  episode_drawdown_penalty: 2.0
  episode_drawdown_threshold: 0.15
  # Regime-conditional budget — integrate proven rt0.6 overlay into training
  use_regime_budget: true
  regime_budget_threshold: 0.60
  regime_budget_cap: 0.30
  regime_budget_penalty: 0.50
  # --- Legacy params: explicitly disabled ---
  return_scale: 0.0
  drawdown_penalty: 0.0
  downside_penalty: 0.0
  risk_budget_penalty: 0.0
  high_exposure_penalty: 0.0
  activity_bonus: 0.0
  inactivity_penalty: 0.0
  opportunity_cost_penalty: 0.0
  pbrs_coef: 0.0
  gated_activity_bonus: false
  profit_taking_bonus: 0.0
  panic_buy_bonus: 0.0
  cooldown_penalty: 0.0
  vol_trading_bonus: 0.0
  underwater_sell_penalty: 0.0
  rule_deviation_penalty: 0.0
  micro_rebalance_penalty: 0.0
  flat_trade_penalty: 0.0
  short_hold_turnover_penalty: 0.0
  stability_bonus: 0.0
  trend_alignment_bonus: 0.0
  downside_asymmetry_coef: 1.0
position_cap:
  start_drawdown: 0.10
  full_drawdown: 0.30
  min_cap: 0.40
  curve_power: 1.0
  bull_min_cap: 0.65
  bull_vol_threshold: 0.40
  bull_anchor_threshold: 0.02
  bear_min_cap: 0.30
  bear_regime_threshold: 0.65
promotion_gate:
  max_test_2022_drawdown: 35.0
  max_test_2022_avg_pos: 0.35
  min_test_proxy_sharpe: 0.75
  min_wf_2023_2024_return: 0.0
  min_wf_2023_2024_sharpe: 0.0
selection_score:
  return_weight: 1.0
  sharpe_weight: 20.0
  max_dd_penalty: 0.12
  avg_pos_penalty: 0.0
  stress_avg_pos_penalty: 0.0
  stress_threshold: 0.65
  staged_training: true
  stage_iters: 20
execution:
  base_threshold: 0.04
  quiet_threshold: 0.08
  stress_threshold: 0.012
  trade_lock_days: 8
model:
  use_hybrid_overlay: true
  delta_levels: [-0.10, -0.05, 0.0, 0.05, 0.10]
  hard_floor: 0.20
  observation_window: 5
  use_gru: true
  gru_hidden_size: 64
