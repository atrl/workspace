# Extreme Events Configuration - 极端行情测试配置

# 极端行情测试用例（根据标的类型调整）
extreme_events:
  - name: "市场崩盘期"
    start: "2020-02-20"
    end: "2020-04-15"
    type: "crash"
    characteristics:
      - "单日跌幅>10%"
      - "流动性枯竭"
    expected_performance:
      max_drawdown: "< 50%"
      recovery_days: "< 60"
    
  - name: "熊市期间"
    start: "2022-01-01"
    end: "2022-12-31"
    type: "bear_market"
    characteristics:
      - "持续下跌"
      - "高风险厌恶"
    expected_performance:
      max_drawdown: "< 40%"
      outperform_benchmark: "> 10%"
  
  - name: "高波动期"
    start: "2025-04-01"
    end: "2025-04-30"
    type: "volatility_spike"
    characteristics:
      - "波动率急剧上升"
      - "方向不明"
    expected_performance:
      max_drawdown: "< 30%"
      recovery_days: "< 20"

# 压力测试配置（通用）
stress_tests:
  - name: "闪崩模拟"
    scenario:
      price_drop_1d: -0.15
    expected_behavior:
      - "触发止损"
      - "限制买入"
  
  - name: "连续下跌"
    scenario:
      consecutive_down_days: 10
      daily_drop: -0.03
    expected_behavior:
      - "逐步减仓"
      - "不追加买入"

# 测试通过标准
pass_criteria:
  all_events:
    - "不爆仓（Max DD < 50%）"
    - "至少跑赢买入持有"
  
  crash_events:
    - "有止损触发记录"
    - "60日内恢复"
  
  bear_market:
    - "年度超额收益>5%"
    - "Max DD < 买入持有"
