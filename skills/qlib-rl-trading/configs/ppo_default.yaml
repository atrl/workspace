# PPO Default Configuration - 通用配置

# 任务配置（根据需要修改）
task:
  name: "<TICKER>动态仓位管理"
  type: "single_asset_timing"
  ticker: "<YOUR_TICKER>"  # 例如: SPY, AAPL, BTC-USD

# 模拟器配置
simulator:
  initial_cash: 100000
  transaction_cost: 0.001  # 10bp
  max_steps: 240           # 约1年交易日
  
  # 风控
  stop_loss: 0.15          # 15%止损
  take_profit: 0.20        # 20%止盈
  max_position: 0.95       # 最大95%仓位
  min_position: 0.0        # 可空仓

# PPO训练配置
training:
  algorithm: "PPO"
  total_timesteps: 100000
  learning_rate: 3e-4
  batch_size: 64
  clip_range: 0.1          # 降低到0.1提高稳定性
  
  # 网络架构
  hidden_dims: [128, 64]
  
  # 优化
  max_grad_norm: 0.1       # 梯度裁剪
  gamma: 0.99              # 折扣因子
  gae_lambda: 0.95         # GAE参数

# 特征配置
features:
  market:
    - return_1d_zscore
    - return_5d_zscore
    - volatility_20d_rank
    - volume_zscore
    - bb_width
    - bb_position
    - rsi_14
  
  external:
    - vix_zscore
    - vix_percentile_20d
    - panic_score

# 奖励配置
reward:
  step_return_weight: 1.0
  risk_penalty_lambda: 0.5
  action_cost_weight: 0.1
  sharpe_bonus_weight: 0.3
