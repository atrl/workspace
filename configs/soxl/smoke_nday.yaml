name: smoke_nday
max_iters: 2
episode_per_iter: 2
episode_len: 240
hidden_sizes: [64, 32]
lr: 0.0003
update_batch_size: 32
update_repeat: 2
reward:
  return_scale: 1.15
  transaction_cost: 0.08
  # 分层 turnover 惩罚：基础值，代码里 <15% 微调会 ×3
  turnover_penalty: 0.08
  drawdown_penalty: 0.28
  downside_penalty: 0.20
  risk_budget_penalty: 0.24
  high_exposure_penalty: 0.08
  smoothness_penalty: 0.05
  # 取消 activity_bonus 和 inactivity_penalty
  activity_bonus: 0.0
  inactivity_penalty: 0.0
  # N-day cumulative reward mode
  use_nday_reward: true
  nday_window: 5
  nday_reward_scale: 1.0
  opportunity_cost_penalty: 0.05
  opportunity_threshold_pos: 0.40
  opportunity_threshold_anchor: 0.05
  opportunity_threshold_trend: 0.02
  pbrs_coef: 0.15
  gated_activity_bonus: false
  activity_gate_vol_threshold: 0.55
  activity_gate_regime_delta_threshold: 0.08
  profit_taking_bonus: 0.25
  panic_buy_bonus: 0.35
  panic_buy_cum_drop_threshold: -0.15
  panic_buy_regime_risk_threshold: 0.60
  cooldown_penalty: 0.0
  vol_trading_bonus: 0.0
position_cap:
  start_drawdown: 0.10
  full_drawdown: 0.30
  min_cap: 0.40
  curve_power: 1.0
  bull_min_cap: 0.65
  bull_vol_threshold: 0.40
  bull_anchor_threshold: 0.02
  bear_min_cap: 0.30
  bear_regime_threshold: 0.65
promotion_gate:
  max_test_2022_drawdown: 35.0
  max_test_2022_avg_pos: 0.35
  min_test_proxy_sharpe: 0.75
  min_wf_2023_2024_return: 0.0
  min_wf_2023_2024_sharpe: 0.0
selection_score:
  return_weight: 1.0
  sharpe_weight: 20.0
  max_dd_penalty: 0.12
  avg_pos_penalty: 0.0
  stress_avg_pos_penalty: 0.0
  stress_threshold: 0.65
  staged_training: false
  stage_iters: 20
model:
  use_tide: true
  observation_window: 3
  tide_hidden_size: 64
  tide_dropout: 0.1
  # 5 档 coarse action space
  action_levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  # 硬底仓：防止空仓踏空
  hard_floor: 0.30
