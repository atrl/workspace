experiment: cognitive_alpha_position_model_v1
card_type: diagnostic_cognitive_alpha_position_model
paper_reference:
  arxiv_id: '2511.18850'
  method: checkpointed_evolution_multimodel_position
qlib:
  provider_uri: /Users/rziiiii/dev/workspace/data/qlib/soxl
  recorder_uri: /Users/rziiiii/dev/workspace/research/cognitive_alpha_position_model_v1/qlib_recorder
  market: all
  region: us
segments:
  train: [2019-01-02, 2024-12-31]
  validation: [2025-01-02, 2025-12-31]
  test: [2026-01-02, 2026-06-24]
factor_mining:
  workflow: cognitive_alpha_factor_mining
  source_layer: src.factor
  candidate_scope: all_generations
  output: alpha_factor_library
  position_model_included: false
  position_signal_included: false
model_selection:
  models: [lgbm_classifier, logistic_regression, ridge, hist_gradient_boosting_classifier]
  selected_by: validation_selection_objective_score
  features: [mined_alpha_library, alpha158, canary_tsmom_components, vix, realized_volatility]
  validation_max_drawdown_floor: -20.0
  test_max_drawdown_floor: -20.0
  extreme_loss_threshold: -0.05
  max_test_extreme_loss_day_count: 5
  min_test_avg_abs_position: 0.05
  max_test_zero_position_day_ratio: 0.90
walk_forward:
  sidecar: backtest_walk_forward_metrics.csv
  folds: [wf_2025_h1, wf_2025_h2, wf_2026_ytd]
  gate: validated_research_position_model_and_walk_forward
direct_factor_backtest:
  workflow: cognitive_alpha_weighted_factor_search
  selected_by: diagnostic_return_sorted_long_only_gate
  recorder_positions: artifacts/cognitive_alpha_direct_weighted/direct_weighted_positions.csv
artifact_policy:
  policy: slim_card_recorder_first
  workflow_config: workflow.yaml
  machine_entrypoint: summary.json
production_paper_sim:
  status: blocked_not_promoted
  required_gate: validated_research_position_model_and_walk_forward
